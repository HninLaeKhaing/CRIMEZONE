<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CrimeZone | Admin Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
  <link rel="stylesheet" href="../safety-chatbot.css" />
  <script src="/admin/assets/login.js" defer></script>
</head>
<body class="admin-login-page">
  <div class="admin-login-glow"></div>
  <main class="admin-login-card">
    <a class="admin-login-brand" href="/">
      <span class="admin-brand-mark">CZ</span>
      <span>CRIME<span>ZONE</span><small>ADMIN CONSOLE</small></span>
    </a>
    <div class="admin-login-kicker"><span class="status-light"></span> RESTRICTED ACCESS</div>
    <h1>Administrator sign in</h1>
    <p class="admin-login-copy">Sign in with the administrator account configured on the server.</p>
    <form id="adminLoginForm">
      <label for="adminUsername">Username</label>
      <input id="adminUsername" name="username" type="text" autocomplete="username" required />
      <label for="adminPassword">Password</label>
      <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />
      <p class="admin-login-error" id="adminLoginError" role="alert" hidden></p>
      <button class="admin-primary-button" id="adminLoginButton" type="submit">Sign in securely</button>
    </form>
    <a class="admin-back-link" href="/">← Back to CrimeZone</a>
    <p class="admin-login-security">Access is checked by the server. Sessions are private to this browser and expire automatically.</p>
  </main>
  <script src="../safety-chatbot.js" defer></script>
</body>
</html>
